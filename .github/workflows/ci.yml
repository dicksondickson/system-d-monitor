name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Host tests (parser, derivation, layouts, touch)
        run: pio test -e native
      - name: "Firmware build (no config.h: builds from the template)"
        run: pio run -e board
      - name: Generated files are up to date
        run: |
          python3 tools/font/mkfont.py
          python3 tools/themes/import_btop.py
          git diff --exit-code -- src/gfx/font_ter10x20.h src/gfx/themes_btop.h
