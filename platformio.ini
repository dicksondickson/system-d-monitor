; System-D Monitor — Guition ESP32-S3-4848S040 (N16R8: 16 MB QIO flash, 8 MB OPI PSRAM)
; See spec.md §2–3. Versions are pinned on purpose; bump deliberately.

[platformio]
default_envs = board

[env:board]
platform = platformio/espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1

; Flash / PSRAM: OPI PSRAM is mandatory, the 450 KB framebuffer lives there.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; USB-C goes through a CH340 UART bridge, not native USB.
upload_speed = 460800   ; 921600 corrupts on this CH340 link
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    moononournation/GFX Library for Arduino@1.6.9

build_src_filter = +<*> -<diag/>

; Archived display diagnostics. Don't build this env directly: run
;   tools/display-diag/run.sh <round> [upload]
; which copies the round into src/diag/ (gitignored) and removes it after.
[env:diag]
extends = env:board
build_src_filter = +<hw/> +<diag/>

